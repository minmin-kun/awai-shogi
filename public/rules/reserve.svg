<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 192" role="img" aria-labelledby="title desc"><title id="title">同時に予約して確定</title><desc id="desc">あなたと相手が30秒以内に駒と移動先を選び、確定。両者の確定後に実行します。</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#39654b"/></marker></defs><rect width="320" height="192" rx="12" fill="#f3f5ed"/><g font-family="sans-serif"><text x="77" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#284f40">あなた</text><text x="243" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#284f40">相手</text><rect x="23" y="49" width="108" height="108" rx="3" fill="#efddb4" stroke="#ba9b64"/><path d="M59 49v108" stroke="#c5ac7b"/><path d="M95 49v108" stroke="#c5ac7b"/><path d="M23 85h108" stroke="#c5ac7b"/><path d="M23 121h108" stroke="#c5ac7b"/><rect x="189" y="49" width="108" height="108" rx="3" fill="#efddb4" stroke="#ba9b64"/><path d="M225 49v108" stroke="#c5ac7b"/><path d="M261 49v108" stroke="#c5ac7b"/><path d="M189 85h108" stroke="#c5ac7b"/><path d="M189 121h108" stroke="#c5ac7b"/><g transform="translate(77 139)" opacity="1"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">歩</text></g><g transform="translate(77 103)" opacity="0.38"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">歩</text></g><path d="M101 139 L101 106" fill="none" stroke="#39654b" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#tip)"/><g transform="translate(243 67) rotate(180)" opacity="1"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">歩</text></g><g transform="translate(243 103) rotate(180)" opacity="0.38"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">歩</text></g><path d="M267 67 L267 100" fill="none" stroke="#39654b" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#tip)"/><circle cx="160" cy="96" r="23" fill="#284f40"/><text x="160" y="96" text-anchor="middle" font-size="19" font-weight="600" fill="#fffefa">30</text><text x="160" y="111" text-anchor="middle" font-size="10" font-weight="600" fill="#fffefa">秒</text><text x="160" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#284f40">駒を選ぶ → 移動先 → 確定</text></g></svg>