<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 192" role="img" aria-labelledby="title desc"><title id="title">一度だけ2手を予約</title><desc id="desc">開始時に後手だった人だけ、二度打ちボタンで2手を予約できます。歩を1マスずつ2回動かす例です。</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#39654b"/></marker></defs><rect width="320" height="192" rx="12" fill="#f3f5ed"/><g font-family="sans-serif"><text x="160" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#284f40">開始後手だけ・対局中1回</text><rect x="95" y="39" width="108" height="108" rx="3" fill="#efddb4" stroke="#ba9b64"/><path d="M131 39v108" stroke="#c5ac7b"/><path d="M167 39v108" stroke="#c5ac7b"/><path d="M95 75h108" stroke="#c5ac7b"/><path d="M95 111h108" stroke="#c5ac7b"/><g transform="translate(149 129)" opacity="1"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">歩</text></g><g transform="translate(149 93)" opacity="0.38"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">歩</text></g><g transform="translate(149 57)" opacity="0.38"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">歩</text></g><path d="M174 127 L174 101" fill="none" stroke="#39654b" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#tip)"/><path d="M174 90 L174 64" fill="none" stroke="#39654b" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#tip)"/><text x="213" y="118" text-anchor="middle" font-size="19" font-weight="600" fill="#284f40">①</text><text x="213" y="81" text-anchor="middle" font-size="19" font-weight="600" fill="#284f40">②</text><text x="160" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#284f40">二度打ちボタン → 2手を予約</text><text x="160" y="186" text-anchor="middle" font-size="10" font-weight="600" fill="#68765c">同じ駒でも、別々の駒でもOK</text></g></svg>