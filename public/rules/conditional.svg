<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 192" role="img" aria-labelledby="title desc"><title id="title">道が空けば移動できる</title><desc id="desc">後手の飛車の前に先手の金がある例。飛車の移動先を指定し、先手の金が横に動いて道が空けば移動できます。</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#39654b"/></marker></defs><rect width="320" height="192" rx="12" fill="#f3f5ed"/><g font-family="sans-serif"><text x="66" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#284f40">指し手を決める時</text><text x="252" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#284f40">実行時</text><rect x="18" y="43" width="96" height="96" rx="3" fill="#efddb4" stroke="#ba9b64"/><path d="M50 43v96" stroke="#c5ac7b"/><path d="M82 43v96" stroke="#c5ac7b"/><path d="M18 75h96" stroke="#c5ac7b"/><path d="M18 107h96" stroke="#c5ac7b"/><rect x="204" y="43" width="96" height="96" rx="3" fill="#efddb4" stroke="#ba9b64"/><path d="M236 43v96" stroke="#c5ac7b"/><path d="M268 43v96" stroke="#c5ac7b"/><path d="M204 75h96" stroke="#c5ac7b"/><path d="M204 107h96" stroke="#c5ac7b"/><rect x="52" y="45" width="28" height="28" rx="3" fill="none" stroke="#9a732d" stroke-width="2" stroke-dasharray="4 3"/><g transform="translate(66 123)" opacity="1"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">飛</text></g><g transform="translate(66 91) rotate(180)" opacity="1"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">金</text></g><path d="M92 123 L92 62" fill="none" stroke="#39654b" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#tip)"/><path d="M127 97 L188 97" fill="none" stroke="#39654b" stroke-width="3" marker-end="url(#tip)"/><text x="158" y="77" text-anchor="middle" font-size="9" font-weight="600" fill="#284f40">先手が移動</text><g transform="translate(220 91) rotate(180)" opacity="1"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">金</text></g><g transform="translate(252 59)" opacity="1"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">飛</text></g><path d="M252 128 L252 83" fill="none" stroke="#39654b" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#tip)"/><text x="160" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#284f40">道が空く → 指定どおりに移動</text><text x="160" y="183" text-anchor="middle" font-size="11" font-weight="600" fill="#68765c">動けなければ、その場に留まる</text></g></svg>