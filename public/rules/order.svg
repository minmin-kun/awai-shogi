<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 192" role="img" aria-labelledby="title desc"><title id="title">先手が取ったら次のターンに交代</title><desc id="desc">先手の飛車が相手の歩を取る例。次のターンは取った側が後手、相手が先手になります。</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#39654b"/></marker></defs><rect width="320" height="192" rx="12" fill="#f3f5ed"/><g font-family="sans-serif"><text x="74" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#284f40">先手が駒を取る</text><rect x="20" y="45" width="108" height="108" rx="3" fill="#efddb4" stroke="#ba9b64"/><path d="M56 45v108" stroke="#c5ac7b"/><path d="M92 45v108" stroke="#c5ac7b"/><path d="M20 81h108" stroke="#c5ac7b"/><path d="M20 117h108" stroke="#c5ac7b"/><g transform="translate(74 63) rotate(180)" opacity="1"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">歩</text></g><g transform="translate(74 135)" opacity="1"><path d="M0 -18 L12 -12 L16 17 L-16 17 L-12 -12 Z" fill="#f4dca8" stroke="#9a783d" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#49391d">飛</text></g><path d="M74 113 L74 86" fill="none" stroke="#39654b" stroke-width="3" marker-end="url(#tip)"/><path d="M142 97 L172 97" fill="none" stroke="#39654b" stroke-width="3" marker-end="url(#tip)"/><rect x="186" y="48" width="120" height="94" rx="8" fill="#fffefa" stroke="#dce3d4"/><text x="246" y="69" text-anchor="middle" font-size="11" font-weight="600" fill="#284f40">次のターン</text><rect x="197" y="80" width="98" height="23" rx="4" fill="#fff0d3"/><text x="246" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#684310">先手 → 後手</text><rect x="197" y="109" width="98" height="23" rx="4" fill="#284f40"/><text x="246" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#fffefa">後手 → 先手</text><text x="160" y="179" text-anchor="middle" font-size="12" font-weight="600" fill="#284f40">後手が駒を取っても、順序はそのまま</text></g></svg>